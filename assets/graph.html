<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knowledge Commons · Clustered graph</title><link rel="stylesheet" href="graph.css?v=2"><body><header><label>Search notes<input id="search" type="search" placeholder="Find a note…"></label><label>Connections<select id="mode"><option value="links">Published note links</option><option value="typed">Typed relations</option></select></label><label>Thematic view<select id="portal"><option value="">All published notes</option><option value="public">Public administration</option><option value="risk">Governance and risk</option></select></label><div class="buttons"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">−</button><button id="reset">Reset view</button></div><label class="toggle"><input id="labels" type="checkbox" checked> Labels</label></header><p id="status" role="status"></p><svg id="graph" viewBox="0 0 1200 760" aria-label="Force-directed graph of published notes"><g id="scene"></g></svg><div id="selected" aria-live="polite">Hover or focus on a node to see its full title and highlight connected notes.</div><p class="help">Click a note to read · drag a node to arrange · drag background to pan · scroll to zoom. Changes affect only your view.</p><details><summary>Browse visible notes as a list</summary><ul id="note-list"></ul></details><script src="graph-data.js?v=2"></script><script src="graph.js?v=2"></script></body></html>
